[project]
name = "laocoon-compute"
version = "0.1.0"
description = "Compute-heavy projections for LAOCOON. Invoked as a subprocess by the Bun side."
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["laocoon"]
